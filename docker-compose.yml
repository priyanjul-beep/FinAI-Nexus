version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: finai_nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finai_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: finai_backend
    environment:
      - DEMO_MODE=true
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/finai_nexus
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=mock
      - EMBEDDING_PROVIDER=mock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: finai_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
